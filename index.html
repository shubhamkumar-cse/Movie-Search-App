<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Search App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="header">
            <h1>🎬 Movie Search</h1>
            <p>Search for your favorite movies</p>
        </div>

        <div class="search-box">
            <input
                type="text"
                id="movieInput"
                placeholder="Enter movie name..."
                autocomplete="off"
            >

            <button id="searchBtn">
                Search
            </button>
        </div>

        <div id="movieResult" class="movie-result">

            <div class="welcome">
                <span>🍿</span>
                <h2>Ready for movie night?</h2>
                <p>Search for a movie to see its details.</p>
            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
